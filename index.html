    moduleDescription: m.description,
  }))
);

function normalizeText(s) {
  return (s || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();
}

function cleanTitle(t) {
  return (t || '')
    .replace(/^Aula\s*\d+\s*[ -]\s*/i, '')
    .replace(/^Colgante\s+/i, 'Pingente ')
    .replace(/\s*\|\s*.*$/, '')
    .trim();
}

function getThumbnailUrl(l) {
  return l.thumbnail || `https://i.ytimg.com/vi/${l.youtubeId}/hqdefault.jpg`;
}

const SearchOverlay = ({
  isOpen,
  allLessons,
  completedIds,
  dynamicTitles,
  onClose,
  onOpenLesson
}) => {
  const [query, setQuery] = React.useState('');
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    if (isOpen) {
      setQuery('');
      setTimeout(() => inputRef.current?.focus(), 60);
    }
  }, [isOpen]);

  React.useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'Escape' && isOpen) {
        onClose();
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [isOpen, onClose]);

  if (!isOpen) return null;

  const normalizedQuery = normalizeText(query.trim());
  const filtered = normalizedQuery
    ? allLessons.filter((l) => {
        const titleStr = dynamicTitles[l.youtubeId] || l.title;
        const searchTarget = normalizeText(`${titleStr} ${l.moduleTitle || ''}`);
        return searchTarget.includes(normalizedQuery);
      })
    : allLessons.slice(0, 12);

  return (
    <div
      onClick={(e) => {
        if (e.target === e.currentTarget) onClose();
      }}
      className="fixed inset-0 z-[100] bg-[#030403dc] backdrop-blur-2xl p-[calc(var(--nav)+22px)_20px_30px] overflow-y-auto"
    >
      <div className="max-w-[950px] mx-auto">
        <div className="h-[60px] border border-white/20 bg-[var(--card)] rounded-2xl flex items-center px-4 gap-3 shadow-2xl">
          <span className="text-xl text-[var(--muted)]">🔍</span>
          <input
            ref={inputRef}
            type="text"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Buscar aula, peça ou tema..."
            className="w-full border-0 outline-none bg-transparent text-white text-lg placeholder:text-white/40"
          />
          <button
            onClick={onClose}
            aria-label="Fechar busca"
            className="border-0 bg-transparent text-2xl text-[var(--muted)] hover:text-white cursor-pointer px-1 transition-colors"
          >
            ✖
          </button>
        </div>
        <div className="grid grid-cols-3 max-md:grid-cols-2 max-sm:grid-cols-1 gap-4 mt-6">
          {filtered.length > 0 ? (
            filtered.map((item) => (
              <LessonCard
                key={item.id}
                lesson={{
                  ...item,
                  title: dynamicTitles[item.youtubeId] || item.title,
                }}
                isCompleted={completedIds.includes(item.id)}
                onOpen={() => {
                  onClose();
                  onOpenLesson(item.id);
                }}
              />
            ))
          ) : (
            <p className="col-span-full text-center py-10 text-[var(--muted)] text-sm">
              Nenhuma aula encontrada para "{query}".
            </p>
          )}
        </div>
      </div>
    </div>
  );
};

        onClick={() => onOpenModule('spiral_decorations')}
        className="border-0 bg-transparent text-[#a5b2a7] hover:text-white flex flex-col justify-center items-center gap-0.5 text-[10px] font-semibold cursor-pointer"
      >
        <span className="text-lg">🎄</span>
        Árvores
      </button>
      <button
        onClick={onOpenSearch}
        className="border-0 bg-transparent text-[#a5b2a7] hover:text-white flex flex-col justify-center items-center gap-0.5 text-[10px] font-semibold cursor-pointer"
      >
        <span className="text-lg">🔍</span>
        Buscar
      </button>
    </nav>
  );
};

const LessonView = ({
  lesson,
  currentModule,
  completedIds,
  dynamicTitles,
  onToggleComplete,
  onSelectLesson,
  onGoHome
}) => {
  const [isLoading, setIsLoading] = React.useState(true);
  const activeItemRef = React.useRef(null);
  const playlistContainerRef = React.useRef(null);
  const currentIndex = currentModule.lessons.findIndex((l) => l.id === lesson.id);
  const isCompleted = completedIds.includes(lesson.id);
  const currentTitle = cleanTitle(dynamicTitles[lesson.youtubeId] || lesson.title);

  React.useEffect(() => {
    setIsLoading(true);
    const timer = setTimeout(() => {
      setIsLoading(false);
    }, 2000);

    requestAnimationFrame(() => {
      const playerElement = document.getElementById('player');
      if (playerElement) {
        playerElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    if (playlistContainerRef.current && activeItemRef.current) {
      const container = playlistContainerRef.current;
      const item = activeItemRef.current;
      const targetScroll = item.offsetTop - container.offsetTop - 12;
      container.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
    }

    return () => clearTimeout(timer);
  }, [lesson.id]);

  const handlePrev = () => {
    if (currentIndex > 0) {
      onSelectLesson(currentModule.lessons[currentIndex - 1].id);
    }
  };

  const handleNext = () => {
    if (currentIndex < currentModule.lessons.length - 1) {
      onSelectLesson(currentModule.lessons[currentIndex + 1].id);
    } else {
      onGoHome();
    }
  };

  return (
    <main className="min-h-screen pt-[calc(var(--nav)+18px)] pb-28">
      <div className="w-[min(1400px,calc(100%-48px))] max-sm:w-[calc(100%-24px)] mx-auto">
        <div className="flex flex-wrap justify-between items-center gap-3 mb-4">
          <button
            onClick={onGoHome}
            className="flex items-center gap-2 text-sm font-extrabold text-[var(--muted)] hover:text-white bg-transparent border-0 cursor-pointer transition-colors p-0"
          >
            ‹ Voltar para o início
          </button>
          <span className="text-xs px-3.5 py-1.5 rounded-full border border-white/10 bg-white/[0.05] text-[#ebeee9] font-bold flex items-center gap-1.5">
            <span className="text-[var(--gold)]">■</span>
            {currentModule.title} • Aula {lesson.order} de {currentModule.lessons.length}
          </span>
        </div>
        <div className="grid grid-cols-[minmax(0,1fr)_390px] max-lg:grid-cols-1 gap-7 items-start">
          <section className="space-y-5">
            <div
              id="player"
              className="scroll-mt-[calc(var(--nav)+14px)] aspect-video bg-[#020302] border border-white/15 rounded-[20px] max-sm:rounded-xl overflow-hidden relative shadow-2xl shadow-black/80 ring-1 ring-white/5"
            >
              {isLoading && (
                <div className="absolute inset-0 z-10 grid place-items-center bg-gradient-to-br from-[#121c15] to-[#070d09] text-[var(--muted)]">
                  <div className="text-center p-4">
                    <div className="w-9 h-9 border-[3px] border-white/15 border-t-[var(--gold)] rounded-full spin mx-auto mb-3" />
                    <span className="text-xs font-bold text-[#e6ece7]">Abrindo videoaula...</span>
                  </div>
                </div>
              )}
              <iframe
                key={lesson.youtubeId}
                src={`https://www.youtube-nocookie.com/embed/${encodeURIComponent(lesson.youtubeId)}?hl=pt-BR&hl_lang=pt-BR&cc_lang_pref=pt&cc_load_policy=1&rel=0&playsinline=1&modestbranding=1`}
                title={currentTitle}
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowFullScreen
                onLoad={() => setIsLoading(false)}
                className="absolute inset-0 w-full h-full border-0"
              />
            </div>
            <div className="p-4 sm:p-5 rounded-2xl border border-[rgba(228,190,113,0.35)] bg-gradient-to-br from-[#17221b] via-[#101913] to-[#0a110d] shadow-xl shadow-amber-950/20">
              <div className="flex items-center gap-2 mb-3">
                <span className="text-xl">🎧</span>
                <h4 className="text-sm sm:text-base font-black text-[var(--gold)] m-0 tracking-tight">
                  Como ouvir a aula com voz dublada em Português
                </h4>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-4 gap-2.5 sm:gap-3 text-xs">
                <div className="bg-white/[0.04] border border-white/10 rounded-xl p-3 flex sm:flex-col items-center sm:items-start gap-3 sm:gap-1.5">
                  <span className="w-6 h-6 rounded-full bg-[var(--gold)] text-[#120f09] font-black grid place-items-center text-xs flex-shrink-0">1</span>
                  <div>
                    <strong className="block text-white">Dê Pause</strong>
                    <span className="text-[#aab6ad] text-[11px] leading-tight">Clique no vídeo para pausar.</span>
                  </div>
                </div>
                <div className="bg-white/[0.04] border border-white/10 rounded-xl p-3 flex sm:flex-col items-center sm:items-start gap-3 sm:gap-1.5">
                  <span className="w-6 h-6 rounded-full bg-[var(--gold)] text-[#120f09] font-black grid place-items-center text-xs flex-shrink-0">2</span>
                  <div>
                    <strong className="block text-white">Engrenagem ⚙️</strong>
                    <span className="text-[#aab6ad] text-[11px] leading-tight">Clique no canto superior direito do vídeo.</span>
                  </div>
                </div>
                <div className="bg-white/[0.04] border border-white/10 rounded-xl p-3 flex sm:flex-col items-center sm:items-start gap-3 sm:gap-1.5">
                  <span className="w-6 h-6 rounded-full bg-[var(--gold)] text-[#120f09] font-black grid place-items-center text-xs flex-shrink-0">3</span>
                  <div>
                    <strong className="block text-white">Faixa de Áudio</strong>
                    <span className="text-[#aab6ad] text-[11px] leading-tight">Toque na opção de Áudio ou Idioma.</span>
                  </div>
                </div>
                <div className="bg-white/[0.04] border border-white/10 rounded-xl p-3 flex sm:flex-col items-center sm:items-start gap-3 sm:gap-1.5">
                  <span className="w-6 h-6 rounded-full bg-[var(--green)] text-[#10180f] font-black grid place-items-center text-xs flex-shrink-0">4</span>
                  <div>
                    <strong className="block text-white">Selecione Português</strong>
                    <span className="text-[#aab6ad] text-[11px] leading-tight">Dê play para ouvir dublado!</span>
                  </div>
                </div>
              </div>
              <div className="mt-3 pt-2.5 border-t border-white/10 text-[11px] text-[#c9d4cc] flex items-center gap-1.5">
                <span className="text-[var(--gold)]">💡</span>
                <span><strong>Dica:</strong> Uma vez selecionado, o YouTube geralmente mantém o áudio em português ativado para as próximas aulas automaticamente.</span>
              </div>
            </div>
            <div className="py-2 px-1">
              <div className="text-[var(--gold)] text-[10px] tracking-[2px] uppercase font-black">
                Assistindo agora • {currentModule.title}
              </div>
              <h1 className="text-[clamp(24px,3.2vw,36px)] max-sm:text-[22px] leading-snug tracking-tight my-2 font-black text-white break-words">
                {currentTitle}
              </h1>
              <p className="text-[var(--muted)] leading-relaxed text-sm m-0 max-w-3xl">
                {currentModule.description}
              </p>
              <div className="flex flex-wrap gap-3 mt-5">
                <button
                  onClick={() => onToggleComplete(lesson.id)}
                  className={`h-11 px-6 rounded-[12px] font-black text-xs flex items-center justify-center gap-2 cursor-pointer transition-all border-0 ${
                    isCompleted
                      ? 'bg-white/[0.12] text-white hover:bg-white/[0.18]'
                      : 'bg-[var(--gold)] text-[#141209] hover:bg-[#edd49d] shadow-lg shadow-amber-950/40'
                  }`}
                >
                  {isCompleted ? '✓ Aula concluída' : '✔ Marcar como concluída'}
                </button>
                <a
                  href={lesson.youtubeUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="h-11 px-5 rounded-[12px] font-bold text-xs border border-[var(--line)] bg-transparent hover:bg-white/[0.06] text-white inline-flex items-center justify-center gap-2 no-underline transition-colors"
                >
                  Abrir no YouTube ↗
                </a>
              </div>
              <div className="flex justify-between items-center gap-3 pt-5 mt-6 border-t border-[var(--line)]">
                <button
                  onClick={handlePrev}
                  disabled={currentIndex === 0}
                  className={`h-11 px-5 rounded-[12px] font-extrabold text-xs border border-[var(--line)] bg-transparent text-white cursor-pointer transition-opacity ${
                    currentIndex === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-white/[0.06]'
                  }`}
                >
                  ‹ Anterior
                </button>
                <button
                  onClick={handleNext}
                  className="h-11 px-6 rounded-[12px] font-black text-xs bg-[var(--gold)] hover:bg-[#ebd296] text-[#141209] border-0 cursor-pointer transition-transform hover:-translate-y-0.5 shadow-md shadow-amber-950/20"
                >
                  {currentIndex === currentModule.lessons.length - 1 ? 'Voltar ao início' : 'Próxima aula ›'}
                </button>
              </div>
            </div>
          </section>
          <aside className="sticky top-[calc(var(--nav)+18px)] max-h-[calc(100vh-var(--nav)-36px)] max-lg:max-h-[500px] max-lg:static bg-[var(--card)] border border-white/10 rounded-[20px] overflow-hidden flex flex-col shadow-xl shadow-black/40">
            <div className="p-4 border-b border-[var(--line)] bg-white/[0.02]">
              <h3 className="text-base font-bold m-0 mb-1 text-white flex items-center gap-2">
                <span>📑</span> {currentModule.title}
              </h3>
              <p className="text-xs text-[var(--muted)] m-0">
                {currentModule.lessons.length} videoaulas nesta trilha
              </p>
            </div>
            <div
              ref={playlistContainerRef}
              className="p-2 overflow-y-auto space-y-1.5 flex-1 scroll-smooth"
            >
              {currentModule.lessons.map((item) => {
                const isActive = item.id === lesson.id;
                const itemDone = completedIds.includes(item.id);
                const itemTitle = cleanTitle(dynamicTitles[item.youtubeId] || item.title);
                return (
                  <button
                    key={item.id}
                    ref={isActive ? activeItemRef : null}
                    onClick={() => onSelectLesson(item.id)}
                    title={itemTitle}
                    className={`w-full grid grid-cols-[104px_1fr] gap-3 p-2.5 rounded-xl text-left cursor-pointer transition-colors border-0 ${
                      isActive
                        ? 'bg-white/[0.1] ring-1 ring-[var(--gold)]/60'
                        : 'bg-transparent hover:bg-white/[0.04]'
                    }`}
                  >
                    <div className="aspect-video rounded-lg overflow-hidden bg-[#18261c] relative flex-shrink-0">
                      <img
                        src={getThumbnailUrl(item)}
                        alt={itemTitle}
                        className="w-full h-full object-cover"
                        loading="lazy"
                        referrerPolicy="no-referrer"
                      />
                    </div>
                    <div className="min-w-0 flex flex-col justify-center">
                      <small className="block text-[var(--gold)] text-[9px] tracking-wider uppercase font-black">
                        Aula {String(item.order).padStart(2, '0')}
                        {item.isNew ? ' • NATAL 🎅' : ''}
                      </small>
                      <strong className="block text-xs font-semibold text-white line-clamp-3 leading-snug mt-0.5 break-words">
                        {itemTitle} {itemDone && <span className="text-[var(--green)]">✓</span>}
                      </strong>
                    </div>
                  </button>
                );
              })}
            </div>
          </aside>
        </div>
      </div>
    </main>
  );
};

const Toast = ({ message }) => {
  if (!message) return null;
  return (
    <div className="fixed z-[120] left-1/2 bottom-7 -translate-x-1/2 bg-[#f1efe8] text-[#111510] px-5 py-3 rounded-full text-xs font-black shadow-2xl transition-all duration-200 animate-in fade-in slide-in-from-bottom-2">
      {message}
    </div>
  );
};

const STORAGE_KEY = 'amigurumi-espiral-natal-v1';

const App = () => {
  const [userState, setUserState] = React.useState(() => {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        return {
          completed: Array.isArray(parsed.completed) ? parsed.completed : [],
          last: parsed.last || null,
          titles: parsed.titles || {},
        };
      }
    } catch (e) {
      console.error(e);
    }
    return { completed: [], last: null, titles: {} };
  });

  const [activeLessonId, setActiveLessonId] = React.useState(null);
  const [isSearchOpen, setIsSearchOpen] = React.useState(false);
  const [toastMessage, setToastMessage] = React.useState(null);
  const [isScrolled, setIsScrolled] = React.useState(false);

  const modules = INITIAL_MODULES;
  const allLessons = React.useMemo(() => {
    return modules.flatMap((m) =>
      m.lessons.map((l) => ({
        ...l,
        title: l.title,
        moduleId: m.id,
        moduleTitle: m.title,
        moduleDescription: m.description,
      }))
    );
  }, [modules]);

  const saveState = React.useCallback((updater) => {
    setUserState((prev) => {
      const next = updater(prev);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      } catch (e) {
        console.error(e);
      }
      return next;
    });
  }, []);

  const showToast = React.useCallback((msg) => {
    setToastMessage(msg);
    setTimeout(() => {
      setToastMessage((current) => (current === msg ? null : current));
    }, 2200);
  }, []);

  React.useEffect(() => {
    const handleScroll = () => {
      setIsScrolled(window.scrollY > 14);
    };
    window.addEventListener('scroll', handleScroll, { passive: true });
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  React.useEffect(() => {
    const handleRoute = () => {
      const params = new URLSearchParams(window.location.hash.slice(1));
      const aula = params.get('aula');
      if (aula && ALL_LESSONS.some((l) => l.id === aula)) {
        setActiveLessonId(aula);
      } else {
        setActiveLessonId(null);
      }
    };
    handleRoute();
    window.addEventListener('popstate', handleRoute);
    return () => window.removeEventListener('popstate', handleRoute);
  }, []);

  const openLesson = React.useCallback(
    (lessonId, pushHistory = true) => {
      const found = ALL_LESSONS.find((l) => l.id === lessonId);
      if (!found) return;
      setActiveLessonId(lessonId);
      saveState((prev) => ({ ...prev, last: lessonId }));

      if (pushHistory) {
        window.history.pushState(
          { id: lessonId },
          '',
          `#aula=${encodeURIComponent(lessonId)}`
        );
      }
      requestAnimationFrame(() => {
        setTimeout(() => {
          const player = document.getElementById('player');
          if (player) {
            player.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        }, 40);
      });
    },
    [saveState]
  );

  const goHome = React.useCallback((pushHistory = true) => {
    setActiveLessonId(null);
    if (pushHistory) {
      window.history.pushState({}, '', window.location.pathname);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, []);

  const openModule = React.useCallback(
    (moduleId) => {
      const m = modules.find((x) => x.id === moduleId);
      if (!m) return;
      const targetLesson =
        m.lessons.find((l) => !userState.completed.includes(l.id)) || m.lessons[0];
      if (targetLesson) {
        openLesson(targetLesson.id);
      }
    },
    [modules, userState.completed, openLesson]
  );

  const scrollToSection = React.useCallback((sectionId) => {
    setActiveLessonId(null);
    window.history.pushState({}, '', window.location.pathname);
    setTimeout(() => {
      const el = document.getElementById(sectionId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }, 50);
  }, []);

  const toggleComplete = React.useCallback(
    (lessonId) => {
      const alreadyDone = userState.completed.includes(lessonId);
      saveState((prev) => ({
        ...prev,
        completed: alreadyDone
          ? prev.completed.filter((id) => id !== lessonId)
          : [...prev.completed, lessonId],
      }));
      showToast(alreadyDone ? 'Aula removida das concluídas' : 'Aula concluída');
    },
    [userState.completed, saveState, showToast]
  );

  const handleResetProgress = React.useCallback(() => {
    if (window.confirm('Apagar o progresso salvo neste aparelho?')) {
      saveState((prev) => ({
        ...prev,
        completed: [],
        last: null,
      }));
      showToast('Progresso reiniciado');
    }
  }, [saveState, showToast]);

  const handleHelpInfo = React.useCallback(() => {
    alert(
      'Áudio em Português: Os vídeos possuem faixa de áudio dublada em português pelo YouTube. O player solicita essa faixa automaticamente. Se por algum motivo o vídeo tocar no idioma original no seu dispositivo, basta clicar no ícone de engrenagem ⚙️ no player e selecionar "Faixa de áudio: Português".'
    );
  }, []);

  const progressPct = Math.round(
    (userState.completed.length / ALL_LESSONS.length) * 100
  );
  const currentActiveLesson = activeLessonId
    ? allLessons.find((l) => l.id === activeLessonId) || null
    : null;
  const currentModule = currentActiveLesson
    ? modules.find((m) => m.id === currentActiveLesson.moduleId) || modules[0]
    : null;
  const lastLesson = React.useMemo(() => {
    return (
      allLessons.find((l) => l.id === userState.last) ||
      allLessons[0]
    );
  }, [allLessons, userState.last]);

  return (
    <div className="min-h-screen flex flex-col bg-[var(--bg)] text-[var(--text)] antialiased">
      <Header
        progressPct={progressPct}
        onGoHome={() => goHome(true)}
        onScrollTo={scrollToSection}
        onOpenSearch={() => setIsSearchOpen(true)}
        isScrolled={isScrolled}
      />
      {currentActiveLesson && currentModule ? (
        <LessonView
          lesson={currentActiveLesson}
          currentModule={currentModule}
          completedIds={userState.completed}
          dynamicTitles={userState.titles}
          onToggleComplete={toggleComplete}
          onSelectLesson={(id) => openLesson(id, true)}
          onGoHome={() => goHome(true)}
        />
      ) : (
        <main id="home">
          <Hero
            totalLessons={ALL_LESSONS.length}
            onContinue={() => openLesson(lastLesson.id, true)}
            onExplore={() => scrollToSection('trilhas')}
          />
          <div className="w-[min(1400px,calc(100%-48px))] max-sm:w-[calc(100%-28px)] mx-auto -mt-9 max-sm:-mt-4 pb-24">
            <ContinueSection
              lesson={lastLesson}
              progressPct={progressPct}
              onOpenLesson={(id) => openLesson(id, true)}
            />
            <TrilhasSection
              modules={modules}
              completedIds={userState.completed}
              dynamicTitles={userState.titles}
              onOpenLesson={(id) => openLesson(id, true)}
              onOpenModule={openModule}
            />
            <FeatureSection onExploreSales={() => openModule('sales')} />
            <MateriaisSection
              onResetProgress={handleResetProgress}
              onHelpInfo={handleHelpInfo}
            />
          </div>
        </main>
      )}
      <SearchOverlay
        isOpen={isSearchOpen}
        allLessons={allLessons}
        completedIds={userState.completed}
        dynamicTitles={userState.titles}
        onClose={() => setIsSearchOpen(false)}
        onOpenLesson={(id) => openLesson(id, true)}
      />
      <Toast message={toastMessage} />
      <Footer />
      <MobileNav
        onGoHome={() => goHome(true)}
        onOpenModule={openModule}
        onOpenSearch={() => setIsSearchOpen(true)}
      />
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

    </script>
  </body>
</html>
